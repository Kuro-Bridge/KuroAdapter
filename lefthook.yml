# lefthook 配置：pre-commit 检查
# 安装：pnpm dlx lefthook install（postinstall 会自动装，见 package.json）
#
# 注意：不用 {staged_files} 展开（Windows + pnpm 转义有坑，曾导致 hook 卡死）；
# 直接跑根脚本，本规模全量检查开销可忽略（~1s），可靠性优先。

pre-commit:
    parallel: true
    commands:
        check:
            run: pnpm check
        test:
            run: pnpm test
        # 协议镜像一致性（ADR-031）：bridge/protocol/src 必须与姊妹仓 KuroProtocol/src 字节级一致；
        # 协议演进只能改 KuroProtocol（四件套同改）再同步镜像，直接改本仓一侧在此拦下。
        check-protocol:
            run: pnpm check:protocol
