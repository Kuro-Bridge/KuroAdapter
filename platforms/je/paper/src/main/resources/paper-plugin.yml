# KuroBridge Paper 插件清单（paper-plugin.yml，Paper 1.19.4+ 格式）
name: KuroBridge
version: 0.1.0
main: com.kurobridge.KuroBridgePlugin
api-version: "1.21"

# 加载时机：服务端启动时（薄壳拉起 Node 子进程）
load: STARTUP

# 权限节点（薄壳注册，业务校验在 bridge/core）
permissions:
    kurobridge.admin:
        description: KuroBridge 管理权限
        default: op
    # 聊天转发开关（v0.3.0 消费，ChatListener 检查）：default true = 全员可转发；
    # negate（设为 false）即静音——该玩家的聊天不再上报 Node
    kurobridge.relay:
        description: 消息互通权限（聊天转发）
        default: true
