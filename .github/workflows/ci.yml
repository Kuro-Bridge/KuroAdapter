# KuroBridge CI（ADR-032：恢复 CI，TS + Java 双 job）
#
# 结构与本地开发链的同构关系（ADR-035）：
# - ts job   = 本地 pre-commit 同构链（pnpm check / test）；check 链自含 build 前置
#              （pnpm -r build 为首环，后续全部静态校验在构建发布面 exports.types →
#              dist d.ts 上进行，fresh clone 直接 pnpm check 自足全绿，见根 package.json）；
# - java job = Java 侧回归（platforms/je 的 ./gradlew build：:core 全部 JUnit 用例、
#              Spotless、-Xlint:all -Werror）。此前 Java 回归不在任何自动化链，CI 起补位。
# - endstone job = C++ portable 层回归（KP-BE-005；2026-09-19-modernize 批次接线，
#              本地等价演练冷启 5/5 绿后加入；命令与 readme.md「构建双轨」逐条同款）。

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ts:
    name: TS（check / test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KuroAdapter
    steps:
      - name: 检出本仓（到 KuroAdapter/ 子目录）
        uses: actions/checkout@v7
        with:
          path: KuroAdapter

      # 不用 `corepack enable`：Node 25 起发行版不再捆绑 corepack（TSC 2025-03 决议），
      # 且本仓根 package.json 无 packageManager 字段（只有 devEngines，corepack 不读），
      # corepack 拿不到钉版会回落到内置默认 pnpm——故用官方 action 按 devEngines 版本装 pnpm。
      - name: 安装 pnpm 11.6.0（版本 = 根 package.json devEngines 钉版）
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: 安装 Node 26（启用 pnpm store 缓存）
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: KuroAdapter/pnpm-lock.yaml

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      # 与本地 pre-commit（lefthook）完全同构的一条命令链，无第二权威（ADR-032）
      - name: 门禁链（check 链自含 build 前置 → test，ADR-035）
        run: pnpm check && pnpm test

  java:
    name: Java（platforms/je gradle build 回归）
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓（到 KuroAdapter/ 子目录）
        uses: actions/checkout@v7
        with:
          path: KuroAdapter

      # Gradle 缓存 + wrapper 校验（KP-JE-005 性能项；setup-gradle@v6 两项默认开启：
      # ~/.gradle 依赖缓存与 gradle-wrapper.jar 校验和校验，补本地缺失的 wrapper 校验一环）。
      # 不用它装 Gradle：本仓以 wrapper 自举（9.7.0 pin），mise 只管 java 25 / node 26。
      - name: Gradle 缓存与 wrapper 校验
        uses: gradle/actions/setup-gradle@v6

      # 只装 mise 本体（install: false），工具安装交给下一步 mise x：
      # mise 从工作目录向上发现 KuroAdapter/mise.toml（java 25 / node 26），
      # 未装的工具先装再带环境执行——对「仓检出到子目录」的布局最不依赖 action 内部行为。
      # （mise 配置发现：cwd 起逐级向上；mise x 语义：缺工具先安装再执行）
      - name: 安装 mise（不预装工具）
        uses: jdx/mise-action@v4
        with:
          install: false

      # gradlew 在 git 里是 100644（无执行位），ubuntu 下直接 ./gradlew 会 Permission denied，
      # 用 sh 显式解释执行（与本地验证命令一致）。
      - name: Gradle build（mise x 携带 java 25 / node 26 环境）
        run: mise x -- sh ./gradlew build
        working-directory: KuroAdapter/platforms/je

  endstone:
    name: Endstone（portable 层 ctest 回归）
    runs-on: windows-latest
    steps:
      - name: 检出本仓（到 KuroAdapter/ 子目录）
        uses: actions/checkout@v7
        with:
          path: KuroAdapter

      # portable 层（KUROBRIDGE_BUILD_DLL=OFF，零 endstone 依赖）三连：配置 → 构建 → 测试，
      # 与 platforms/be/endstone/readme.md「构建双轨」及本地演练逐条等价（2026-09-20 冷启
      # 实跑 5/5 Passed 3.78s）。工具前提（windows-latest 镜像全预装，无需安装步骤）：
      # - CMake ≥ 3.29 + Ninja（CMakeLists.txt cmake_minimum_required 3.29 / preset 钉 Ninja）；
      # - MSVC 工具链（CMake 对 Ninja 自动探测 VS；/utf-8 由 CMakeLists 按前端变体自加）；
      # - PATH 上的 node（test_node_ipc 集成面用；缺失时该测试面内自跳过返回 0）。
      # 注：kurobridge_core 含 Win32 进程管理源（process_factory/node_ipc 等，无平台宏
      # 分支），ubuntu 不可编译——runner 必须是 windows 系。
      - name: CMake configure + build + ctest（portable 层）
        run: cmake --preset core && cmake --build --preset core && ctest --preset core
        working-directory: KuroAdapter/platforms/be/endstone
